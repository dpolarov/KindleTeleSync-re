name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarm: [6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build binaries (GOARM ${{ matrix.goarm }})
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          FLAGS="-s -w -X main.GoArmVersion=$GOARM"
          DEST="build/package/extensions/KindleTeleSync"
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/kindle_sync_d" ./cmd/kindle_sync_d
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/updater" ./cmd/updater
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/webconfig" ./cmd/webconfig
          chmod +x "$DEST/kindle_sync_d" "$DEST/updater" "$DEST/webconfig"

      - name: Compress binaries
        run: |
          DEST="build/package/extensions/KindleTeleSync"
          upx --best --lzma "$DEST/kindle_sync_d" "$DEST/updater" "$DEST/webconfig"

      - name: Copy README into package
        run: cp README.md build/package/extensions/KindleTeleSync/README.md

      - name: Patch package version and author
        run: |
          CONFIG="build/package/extensions/KindleTeleSync/config.xml"
          VERSION_TXT="build/package/extensions/KindleTeleSync/version.txt"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i -E "s|<version>[^<]+</version>|<version>${VERSION}</version>|" "$CONFIG"
          sed -i -E "s|<author>[^<]+</author>|<author>dpolarov</author>|" "$CONFIG"
          echo "$VERSION" > "$VERSION_TXT"

      - name: Create release archive (GOARM ${{ matrix.goarm }})
        run: |
          ARCHIVE="KindleTeleSync-arm${{ matrix.goarm }}.tar.gz"
          tar -C build/package -czf "$ARCHIVE" extensions koreader

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleTeleSync-arm${{ matrix.goarm }}
          path: KindleTeleSync-arm${{ matrix.goarm }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## KindleTeleSync ${{ github.ref_name }}

            Download the archive matching your Kindle CPU:
            - `KindleTeleSync-arm7.tar.gz` — most newer jailbroken Kindles
            - `KindleTeleSync-arm6.tar.gz` — older ARMv6 Kindles

            Extract the archive to `/mnt/us` and restart KUAL/KOReader if necessary.
