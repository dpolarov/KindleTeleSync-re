name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'rc/**'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarm: [6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME#rc/}"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "Release tag must start with v, got: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build KindleTeleSync (GOARM ${{ matrix.goarm }})
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DEST="build/package/extensions/KindleTeleSync"
          FLAGS="-s -w -X main.GoArmVersion=$GOARM -X main.Version=$VERSION -X main.RepoPath=${{ github.repository }}"
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/kindletelesync" ./cmd/kindletelesync
          chmod +x "$DEST/kindletelesync"

      - name: Prepare package metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DEST="build/package/extensions/KindleTeleSync"
          cp README.md "$DEST/README.md"
          sed -i -E "s|<version>[^<]+</version>|<version>${VERSION}</version>|" "$DEST/config.xml"
          sed -i -E "s|<author>[^<]+</author>|<author>dpolarov</author>|" "$DEST/config.xml"
          echo "$VERSION" > "$DEST/version.txt"

      - name: Create architecture release archive
        run: |
          ARCHIVE="KindleTeleSync-arm${{ matrix.goarm }}.tar.gz"
          tar -C build/package -czf "$ARCHIVE" extensions koreader

      - name: Build runtime-detecting universal archive
        if: matrix.goarm == 6
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 6
          CGO_ENABLED: 0
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DEST="build/package/extensions/KindleTeleSync"
          FLAGS="-s -w -X main.GoArmVersion=auto -X main.Version=$VERSION -X main.RepoPath=${{ github.repository }}"
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/kindletelesync" ./cmd/kindletelesync
          chmod +x "$DEST/kindletelesync"
          tar -C build/package -czf KindleTeleSync-universal.tar.gz extensions koreader

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: KindleTeleSync-arm${{ matrix.goarm }}
          path: |
            KindleTeleSync-arm${{ matrix.goarm }}.tar.gz
            KindleTeleSync-universal.tar.gz
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
          else
            TAG="${GITHUB_REF_NAME#rc/}"
            PRERELEASE=true
          fi
          if [[ "$TAG" != v* ]]; then
            echo "Release tag must start with v, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum KindleTeleSync-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            dist/KindleTeleSync-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## KindleTeleSync ${{ steps.meta.outputs.tag }}

            These builds target Go 1.23's Linux baseline (kernel 2.6.32 or newer).

            Download one archive and extract it to `/mnt/us`:
            - `KindleTeleSync-arm7.tar.gz` — optimized for ARMv7 Kindles
            - `KindleTeleSync-arm6.tar.gz` — optimized for ARMv6 Kindles with a compatible kernel
            - `KindleTeleSync-universal.tar.gz` — conservative ARMv6-compatible build with runtime ARM detection

            RC builds are published as GitHub prereleases. From an installed RC, use `kindletelesync update --prerelease` to test updates to a newer RC.

            Very old Kindles running Linux 2.6.31 are not supported by the Go runtime used for these builds.
            Every archive is verified by the built-in updater against the attached `SHA256SUMS` file.
            Restart KOReader after installing an update so the plugin UI is reloaded.
