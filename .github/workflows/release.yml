name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarm: [6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build KindleTeleSync (GOARM ${{ matrix.goarm }})
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEST="build/package/extensions/KindleTeleSync"
          FLAGS="-s -w -X main.GoArmVersion=$GOARM -X main.Version=$VERSION -X main.RepoPath=${{ github.repository }}"
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/kindletelesync" ./cmd/kindletelesync
          chmod +x "$DEST/kindletelesync"
          upx --best --lzma "$DEST/kindletelesync"

      - name: Prepare package metadata
        run: |
          DEST="build/package/extensions/KindleTeleSync"
          VERSION="${GITHUB_REF_NAME#v}"
          cp README.md "$DEST/README.md"
          sed -i -E "s|<version>[^<]+</version>|<version>${VERSION}</version>|" "$DEST/config.xml"
          sed -i -E "s|<author>[^<]+</author>|<author>dpolarov</author>|" "$DEST/config.xml"
          echo "$VERSION" > "$DEST/version.txt"

      - name: Create architecture release archive
        run: |
          ARCHIVE="KindleTeleSync-arm${{ matrix.goarm }}.tar.gz"
          tar -C build/package -czf "$ARCHIVE" extensions koreader

      - name: Build runtime-detecting universal archive
        if: matrix.goarm == 6
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 6
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEST="build/package/extensions/KindleTeleSync"
          FLAGS="-s -w -X main.GoArmVersion=auto -X main.Version=$VERSION -X main.RepoPath=${{ github.repository }}"
          go build -trimpath -ldflags="$FLAGS" -o "$DEST/kindletelesync" ./cmd/kindletelesync
          chmod +x "$DEST/kindletelesync"
          upx --best --lzma "$DEST/kindletelesync"
          tar -C build/package -czf KindleTeleSync-universal.tar.gz extensions koreader

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: KindleTeleSync-arm${{ matrix.goarm }}
          path: |
            KindleTeleSync-arm${{ matrix.goarm }}.tar.gz
            KindleTeleSync-universal.tar.gz
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum KindleTeleSync-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KindleTeleSync-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## KindleTeleSync ${{ github.ref_name }}

            Download one archive and extract it to `/mnt/us`:
            - `KindleTeleSync-arm7.tar.gz` — optimized for newer ARMv7 Kindles
            - `KindleTeleSync-arm6.tar.gz` — optimized for older ARMv6 Kindles
            - `KindleTeleSync-universal.tar.gz` — ARMv6-compatible build with runtime ARM detection for future updates

            Every archive is verified by the built-in updater against the attached `SHA256SUMS` file.
            Restart KOReader after installing an update so the plugin UI is reloaded.
