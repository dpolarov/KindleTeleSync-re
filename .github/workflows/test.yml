name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-build ARMv6
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 6
          CGO_ENABLED: 0
        run: go build -trimpath -o /tmp/kindletelesync-arm6 ./cmd/kindletelesync
      - name: Cross-build ARMv7
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: go build -trimpath -o /tmp/kindletelesync-arm7 ./cmd/kindletelesync
